name: Release utunws engine

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal utunws
        run: ./scripts/build-universal.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utunws-darwin-universal
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/utunws
            dist/SHA256SUMS.txt
            dist/BUILDINFO.txt
